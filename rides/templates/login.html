
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CampusRide</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f0ff, #f7f9ff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(30, 50, 90, .12);
        }
        .logo { color: #3157d5; font-size: 27px; font-weight: bold; }
        h2 { margin-bottom: 8px; color: #17233c; }
        .subtitle { color: #6b7280; margin-bottom: 25px; }
        form p { margin: 18px 0; }
        label { display: block; margin-bottom: 7px; font-weight: 600; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dbea;
            border-radius: 8px;
            font-size: 15px;
        }
        input:focus { outline: 2px solid #bdccff; }
        .errorlist { color: #c62828; font-size: 13px; }
        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: #3157d5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #2445b7; }
        .links { text-align: center; margin-top: 20px; color: #6b7280; }
        a { color: #3157d5; text-decoration: none; }
        .back { display: block; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">CampusRide</div>
        <h2>Welcome back!</h2>
        <p class="subtitle">Log in to continue your campus journey.</p>

        {% if form.errors %}
            <p class="errorlist">Username or password is incorrect. Please try again.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Log In</button>
        </form>

        <div class="links">
            New to CampusRide?
            <a href="{% url 'register' %}">Create account</a>
        </div>
        <a class="back" href="{% url 'home' %}">← Back to Home</a>
    </main>
</body>
</html>
